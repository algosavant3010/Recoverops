[project]
name = "recoverops"
version = "0.1.0"
description = "Autonomous, auditable revenue-recovery agent for Razorpay merchants."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Naman Agarwal" }]
dependencies = [
    "pydantic>=2.7,<3",
    "PyYAML>=6.0,<7",
    "Faker>=25,<40",
    "python-dateutil>=2.9,<3",
    "typing-extensions>=4.11",
]

[project.optional-dependencies]
llm = [
    "google-genai>=1.0,<2",
]
ui = [
    "streamlit>=1.36,<2",
    "pandas>=2.2,<3",
    "plotly>=5.22,<7",
]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.5,<1",
]

[project.scripts]
recoverops-gen-data = "recoverops.data.generator:_cli"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recoverops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]
